name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bundle Ollama binary
        run: node scripts/fetch-ollama.mjs

      - run: npm run build

      # Developer ID signing + notarization turn ON automatically once the
      # Apple secrets exist (MAC_CERT_P12, MAC_CERT_PASSWORD, APPLE_API_KEY_P8,
      # APPLE_API_KEY_ID, APPLE_API_ISSUER — see README). Without them the
      # build ships ad-hoc signed exactly as before.
      - name: Enable notarization when Apple credentials exist
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_API_KEY_P8 }}" ]; then
            printf '%s' "${{ secrets.APPLE_API_KEY_P8 }}" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "EB_NOTARIZE=-c.mac.notarize=true" >> "$GITHUB_ENV"
          fi

      - name: Build and publish installers
        shell: bash
        run: npx electron-builder --publish always $EB_NOTARIZE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit cert only (empty = ship ad-hoc signed); never let
          # electron-builder pick up a stray keychain identity on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
